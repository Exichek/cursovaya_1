[project]
name = "cursovaya"
version = "0.1.0"
description = "Приложение для анализа банковских транзакций"
authors = [
    { name = "Exi" }
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pandas (>=3.0.5,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "types-requests (>=2.33.0.20260906,<3.0.0.0)",
    "pandas-stubs (>=3.0.5.260914,<4.0.0.0)"
]

[tool.poetry]
package-mode = false

[tool.black]
line-length = 119
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 119

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true